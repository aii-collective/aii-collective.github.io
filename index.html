<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI+I Collective · 智人合作社</title>
<meta name="description" content="AI+I Collective — enabling human-AI co-creation and problem solving. Briefing for Beijing Academy of AI, November 2026." />
<style>
  :root {
    --ink: #0F1115;
    --ink-2: #41464E;
    --ink-3: #61666B;
    --ink-4: #81858C;
    --canvas: #FFFFFF;
    --surface: #F7F8FA;
    --line: rgba(0, 0, 0, 0.12);
    --line-soft: rgba(0, 0, 0, 0.07);
    --blue: #4176E6;
    --blue-soft: #EDF3FE;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 56px 24px;
  }
  main { width: 100%; max-width: 920px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
  .brand .mark { width: 9px; height: 9px; background: var(--blue); border-radius: 2px; }
  .brand b { letter-spacing: 0.14em; color: var(--ink); font-weight: 600; }
  .kicker { margin-top: 44px; font-size: 14px; letter-spacing: 0.1em; color: var(--blue); font-weight: 600; }
  h1 { margin: 14px 0 0; font-size: 64px; line-height: 1.2; font-weight: 600; letter-spacing: 0; }
  h1 span { display: block; margin-top: 6px; font-size: 28px; line-height: 1.3; color: var(--ink-3); font-weight: 500; }
  .lede { margin: 22px 0 0; font-size: 18px; line-height: 1.8; color: var(--ink-3); max-width: 660px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 44px; }
  .choice {
    display: block;
    padding: 26px 26px 24px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--ink);
    background: var(--canvas);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .choice:hover, .choice:focus-visible {
    border-color: var(--blue);
    border-top-color: var(--blue);
    background: var(--blue-soft);
    outline: none;
    transform: translateY(-2px);
  }
  .choice .lang { display: block; font-size: 30px; font-weight: 600; letter-spacing: 0; }
  .choice .desc { display: block; margin-top: 8px; font-size: 15px; line-height: 1.6; color: var(--ink-3); }
  .choice .go { display: block; margin-top: 18px; font-size: 14px; color: var(--blue); font-weight: 600; }
  .note { margin: 40px 0 0; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; line-height: 1.7; color: var(--ink-4); }
  .note a { color: var(--ink-3); }
  @media (max-width: 720px) {
    h1 { font-size: 40px; }
    h1 span { font-size: 20px; }
    .choices { grid-template-columns: 1fr; gap: 16px; }
    .choice .lang { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark"></span><b>AI+I</b><span>智人合作社</span></div>
  <p class="kicker">北京智源交流 · 2026 年 11 月</p>
  <h1>选择语言<span>Choose a language</span></h1>
  <p class="lede">这是面向北京智源的一次交流材料：主产品圆方（OSq）、研究线传送门（Portal），以及一条走过的路。请选择阅读版本。</p>

  <div class="choices">
    <a class="choice" href="briefing/deck-web.html">
      <span class="lang">中文</span>
      <span class="desc">完整演示 · 8 页正文与 3 页附录</span>
      <span class="go">进入演示 →</span>
    </a>
    <a class="choice" href="briefing/en.html">
      <span class="lang">English</span>
      <span class="desc">English edition · in preparation</span>
      <span class="go">Continue →</span>
    </a>
  </div>

  <p class="note">演示是静态页面：方向键翻页，按 N 看讲稿，按 F 全屏。<a href="briefing/deck-web.pdf">PDF 版</a>便于保存与转发。</p>
</main>
</body>
</html>
