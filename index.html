<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智人合作社 · AII Collective</title>
<meta name="description" content="AII Collective — enabling human-AI co-creation and problem solving. Briefing for Beijing Academy of AI, November 2026." />
<style>
  :root {
    --ink: #0F1115;
    --ink-2: #41464E;
    --ink-3: #61666B;
    --canvas: #FFFFFF;
    --line: rgba(0, 0, 0, 0.12);
    --blue: #4176E6;
    --blue-soft: #EDF3FE;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 56px 24px;
  }
  main { width: 100%; max-width: 920px; }
  h1 { margin: 0; font-size: 64px; line-height: 1.2; font-weight: 600; letter-spacing: 0; }
  h1 span { display: block; margin-top: 8px; font-size: 28px; line-height: 1.3; color: var(--ink-3); font-weight: 500; letter-spacing: 0.14em; }
  .sub { margin: 34px 0 0; font-size: 28px; line-height: 1.35; color: var(--ink-2); font-weight: 500; }
  .sub span { display: block; margin-top: 4px; font-size: 18px; color: var(--ink-3); font-weight: 400; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 36px; }
  .choice {
    display: block;
    padding: 26px 26px 24px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--ink);
    background: var(--canvas);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .choice:hover, .choice:focus-visible {
    border-color: var(--blue);
    border-top-color: var(--blue);
    background: var(--blue-soft);
    outline: none;
    transform: translateY(-2px);
  }
  .choice .lang { display: block; font-size: 30px; font-weight: 600; letter-spacing: 0; }
  .choice .desc { display: block; margin-top: 8px; font-size: 15px; line-height: 1.6; color: var(--ink-3); }
  .choice .go { display: block; margin-top: 18px; font-size: 14px; color: var(--blue); font-weight: 600; }
  @media (max-width: 720px) {
    h1 { font-size: 42px; }
    h1 span { font-size: 20px; }
    .sub { font-size: 22px; margin-top: 26px; }
    .sub span { font-size: 16px; }
    .choices { grid-template-columns: 1fr; gap: 16px; }
    .choice .lang { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <h1>智人合作社<span>AII Collective</span></h1>
  <p class="sub">选择语言<span>Choose a language</span></p>

  <div class="choices">
    <a class="choice" href="briefing/deck-web.html">
      <span class="lang">中文</span>
      <span class="desc">完整演示 · 8 页正文与 3 页附录</span>
      <span class="go">进入演示 →</span>
    </a>
    <a class="choice" href="briefing/en.html">
      <span class="lang">English</span>
      <span class="desc">English edition · in preparation</span>
      <span class="go">Continue →</span>
    </a>
  </div>
</main>
</body>
</html>
